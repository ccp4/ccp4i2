name: Electron Multiplatform Build

# Docs/presentation-only changes never affect the desktop build, so the
# (expensive, 3-platform) package run is skipped when a push/PR touches ONLY
# documentation. A changeset that mixes docs with any source file still builds.
#
# The skip is decided by the `changes` job below, NOT by a workflow-level
# `paths-ignore`. The three build jobs are required checks on django, and a
# workflow skipped by a path filter never reports them: they sit at "Expected"
# for ever, so a Markdown-only PR could not be merged at all (found 2026-09-18,
# when the first project skill had to ride on a code PR to land). A JOB skipped
# by an `if:` reports success, which is exactly what a docs-only change
# deserves. Do not reintroduce `paths-ignore` here, and do not "fix" this with
# a second workflow that reports the same job names: a PR touching docs and
# code would then run both, and a passing stub can mask a failing build.
on:
  push:
    branches:
      - django
      - electron-no-bundle-python
  pull_request:
    branches:
      - django

jobs:
  # Decides whether anything other than documentation changed. The rule lives
  # in .github/scripts/changes-need-build.sh so it can be run locally.
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            build="$(.github/scripts/changes-need-build.sh \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" merge-base)"
          else
            build="$(.github/scripts/changes-need-build.sh \
              "${{ github.event.before }}" "${{ github.sha }}" direct)"
          fi
          echo "build=${build}" >> "$GITHUB_OUTPUT"
          echo "Desktop build needed: ${build}"

  build-mac:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install ccp4i2-api devDeps (so prepare can run tsc)
        run: npm ci
        working-directory: packages/ccp4i2-api

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build and package macOS app (dmg)
        # Per-push builds are intentionally UNSIGNED. Signing/notarisation only
        # happens in the Release workflow when the Apple secrets are present.
        # Disabling identity auto-discovery keeps this build from trying (and
        # failing) to sign now that mac.identity is no longer pinned to null.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package-mac -- --publish never
        working-directory: client

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macOS-dmg
          path: client/release/*.dmg

  build-win:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install ccp4i2-api devDeps (so prepare can run tsc)
        run: npm ci
        working-directory: packages/ccp4i2-api

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build and package Windows app
        run: npm run package-win -- --publish never
        working-directory: client

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            client/release/*.exe

  build-linux:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install ccp4i2-api devDeps (so prepare can run tsc)
        run: npm ci
        working-directory: packages/ccp4i2-api

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build and package Linux AppImage
        run: npm run package-linux-x64 -- --publish never
        working-directory: client

      - name: List release contents
        run: ls -lh client/release

      - name: Upload Linux artifacts (AppImage + deb)
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimages
          path: |
            client/release/*.AppImage
            client/release/*.deb

# Fast test gate for pull requests into `django`.
# ============================================================================
# Runs the suites that need NOTHING from the CCP4 suite — no binaries, no
# $CCP4 tree, no downloaded test data — on a stock CPython with the pip
# dependencies `server/pyproject.toml` declares, plus the client's vitest
# suite. That is ~1100 tests in about a minute on a plain ubuntu runner.
#
# Why not the rest: `tests/i2run/` and `tests/api/e2e/` run real
# crystallographic jobs — they need a full CCP4 install and download reference
# data from PDBe/RCSB, so they belong on a machine with CCP4, not here. What is
# covered is the whole container/CData/def.xml core, MTZ and PDB handling,
# converters, reports, plugin infrastructure, validation, serialization and
# every REST endpoint.
#
# Running the suites as SEPARATE steps is deliberate, not tidiness: the
# heavyweight conftest under tests/api/ builds a Django test database, and once
# one exists the report-fixture tests in tests/unit/lib/ take a database path
# and fail looking for jobs that belong to another suite's fixtures. Each suite
# is green on its own; combining them in one pytest process is not.
#
# Anything here needing a CCP4 binary or an optional [science] extra skips
# rather than fails (see the skipif guards in tests/unit/converters/ and the
# importorskip in tests/unit/phil/), so the same command is green with or
# without CCP4 — but running it locally under ccp4-python does NOT check this
# job. You get strictly more coverage there, and that can be a different
# answer: a test that itself needs CCP4 passes locally and fails here. To
# reproduce this job, use a stock venv with no CCP4:
#     cd server && python3 -m venv .venv && .venv/bin/pip install -e ".[dev]"
#     .venv/bin/python -m pytest ccp4i2/tests/unit/ -q
# See CLAUDE.md, "Reproducing CI locally: the CCP4-free venv".
# ============================================================================

name: CI

on:
  # Every pull request, not only those targeting django: work is sometimes
  # stacked on an unmerged branch, and a PR with no gate is the situation this
  # job exists to remove.
  pull_request:
  push:
    branches:
      - django
  # Also dispatched by retarget.yml when a pull request's base changes, with
  # `base` naming the new base branch; see that workflow for why.
  workflow_dispatch:
    inputs:
      base:
        description: Branch to scope the changes against (empty runs everything)
        required: false
        default: ''

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What does this changeset actually need? The rule lives in
  # .github/scripts/changes-need.sh so it can be run locally.
  #
  # Gated with a job-level `if`, never with `paths-ignore` on the trigger: a
  # REQUIRED check whose workflow never runs never reports, and the pull request
  # waits for it forever. A job skipped by a condition satisfies the
  # requirement. That distinction is why the docs-only path is built this way
  # (#555), and this extends the same mechanism.
  scope:
    name: Scope
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
      userdocs: ${{ steps.decide.outputs.userdocs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: decide
        shell: bash
        env:
          BASE_BRANCH: ${{ inputs.base }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            .github/scripts/changes-need.sh \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" merge-base \
              | tee -a "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # An empty or unknown base makes the script run everything.
            base="${BASE_BRANCH:+origin/$BASE_BRANCH}"
            .github/scripts/changes-need.sh "$base" "${{ github.sha }}" merge-base \
              | tee -a "$GITHUB_OUTPUT"
          else
            .github/scripts/changes-need.sh \
              "${{ github.event.before }}" "${{ github.sha }}" direct \
              | tee -a "$GITHUB_OUTPUT"
          fi

  # Seconds, and unconditional: an alpha app pins the EXACT backend version it
  # requires and refuses any other, so that pin and ccp4i2.__version__ must
  # agree. Nothing checked it -- release.yml compares the tag with __version__
  # and never the client pin, and cut-alpha.sh only holds the invariant for
  # bumps that go through it. Either file can break it, so this does not gate on
  # paths.
  version-lockstep:
    name: Version lockstep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/check-version-lockstep.sh

  unit-tests:
    name: Unit + API tests (Python ${{ matrix.python-version }})
    needs: scope
    # The skip is on the STEPS, not on the job, and it has to be. Skipping a
    # MATRIX job publishes the unexpanded template as the check name --
    # "Unit + API tests (Python ${{ matrix.python-version }})" -- because there
    # is no matrix to expand for a job that never ran. The required contexts
    # "(Python 3.11)" and "(Python 3.13)" then never report, sit at "Expected",
    # and the pull request cannot be merged: exactly the breakage paths-ignore
    # used to cause (#555), reintroduced by gating the job. A docs-only PR hit
    # it immediately (#659).
    #
    # Running the job with every step skipped keeps the names right and costs
    # seconds. frontend-tests is not a matrix job, so its name is static and it
    # is safely gated at job level.
    #
    # A client-only change cannot break the Python suites. If that ever stops
    # being true -- a contract test that reads a client fixture, say -- widen
    # the rule rather than relying on this comment.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what CCP4 currently ships as ccp4-python, so it is the version
        # that actually has to work; 3.13 catches drift before the next CCP4
        # bumps its interpreter.
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4
        if: needs.scope.outputs.backend == 'true'

      - uses: actions/setup-python@v5
        if: needs.scope.outputs.backend == 'true'
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: server/pyproject.toml

      - name: Install the server and its test toolchain
        if: needs.scope.outputs.backend == 'true'
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Assert CCP4 really is absent
        if: needs.scope.outputs.backend == 'true'
        # The point of this job is that these suites need no CCP4. If a runner
        # image ever grew one, the job would silently start proving less.
        run: |
          if [ -n "${CCP4:-}" ] || command -v refmacat >/dev/null 2>&1; then
            echo "::error::CCP4 present on the runner - this job must run CCP4-free"
            exit 1
          fi
          echo "no CCP4 on the runner, as intended"

      # A grep, but the only check available for this family: CData and the
      # report nodes define __getattr__, so a type checker must assume any
      # attribute exists. cmapcoeff called lxml's pretty_print on the standard
      # library for years and no cmapcoeff job ever wrote a program.xml.
      # Stdlib only and instant, so it runs before the suites.
      - name: Missing-API check (lxml-only APIs off lxml)
        if: needs.scope.outputs.backend == 'true'
        run: python3 scripts/check_lxml_api.py

      - name: Unit tests
        if: needs.scope.outputs.backend == 'true'
        working-directory: server
        run: python -m pytest ccp4i2/tests/unit/ -q

      - name: API tests
        if: needs.scope.outputs.backend == 'true'
        working-directory: server
        run: python -m pytest ccp4i2/tests/api/unit/ -q

      # The async-execution tier. It is CCP4-free (the ctruncate tests skip
      # themselves without the binary) and fast. It spent a long time running
      # nowhere -- one module stubbed Django into sys.modules at import time,
      # which killed the whole pytest session -- so it is wired into CI here
      # to stop that recurring silently.
      - name: Async execution tests
        if: needs.scope.outputs.backend == 'true'
        working-directory: server
        run: python -m pytest ccp4i2/tests/async_execution/ -q

      # Database operations, project import/export, and the interactive-session
      # mechanism that drives every interactive task's job. The tests whose
      # fixtures still come from the external test101 checkout skip themselves
      # when it is absent, the same way tests/api/unit/ does.
      - name: Database tests
        if: needs.scope.outputs.backend == 'true'
        working-directory: server
        run: python -m pytest ccp4i2/tests/db/ -q

      # Configuring a job without running it: adding rows to a list, uploading
      # into them, removing one, adding another. Neither i2run (which never
      # touches the upload endpoint) nor api/e2e (busy running pipelines) does
      # that, and the gap is how a file-deleting bug reached a user. No CCP4
      # binaries, about five seconds.
      - name: API configuration tests
        if: needs.scope.outputs.backend == 'true'
        working-directory: server
        run: python -m pytest ccp4i2/tests/api/config/ -q

  user-docs:
    # The user help (docs/user/) is RST that can break: a bad directive, a
    # figure that is referenced and missing. Build it whenever it changes, even
    # on a pull request that runs nothing else, and fail on more warnings than
    # the recorded baseline (tools/warnings-baseline.txt). The built site is an
    # artifact, so a reviewer can read the pages as users will. Figures are not
    # captured here: that needs CCP4 and a running app (docs/user/README.md).
    name: User docs
    needs: scope
    if: needs.scope.outputs.userdocs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r docs/user/requirements.txt
      - run: docs/user/tools/build.sh "$RUNNER_TEMP/userdocs"
      # A help page whose task has changed since it was checked: a warning on
      # the PR naming the page and the files, never a failure (the change may
      # well leave the page right; stamp.py diff shows, stamp.py stamp says so).
      - name: Help pages the change may have outdated
        run: |
          python3 docs/user/tools/stamp.py check --github
          { echo '### User help drift'; echo '```'
            python3 docs/user/tools/stamp.py check; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: user-docs
          path: ${{ runner.temp }}/userdocs
          retention-days: 7

  frontend-tests:
    # The client had 278 vitest tests and no job running them, so nothing on a
    # PR could tell you they had broken. They need no CCP4 and no database --
    # scene lifting, diagnostics parsing, and the task-interface parameter
    # coverage ratchet, which is only a ratchet if something pulls it.
    name: Frontend tests
    needs: scope
    # vitest with mocked fetch and tsc: nothing here reaches the server, so a
    # server-only change cannot alter the outcome.
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Vitest
        working-directory: client
        run: npm test

# Standalone check: are the macOS signing/notarisation secrets visible to a
# repo-scoped Actions job, with the exact names the release workflow expects?
#
# Run it from Actions -> "Check signing secrets" -> Run workflow. It prints a
# presence readout (names + lengths, NEVER values) so you can confirm all five
# are set as REPOSITORY (or org) secrets before cutting a release tag — the real
# release job (release.yml build-desktop) has no `environment:`, so it sees only
# repo/org secrets, exactly like this job.
#
# This exists because release.yml's build-desktop `needs: verify-version`, and
# verify-version asserts the tag == package version — so a workflow_dispatch from
# a branch fails there and never reaches the macOS build. This job has no such
# gate, so it's the way to test the secrets without burning a version.
name: Check signing secrets

on:
  workflow_dispatch: {}

jobs:
  check:
    name: Presence of macOS signing secrets (repo scope)
    runs-on: ubuntu-latest
    env:
      MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - name: Report (names + lengths only, never values)
        shell: bash
        run: |
          echo "macOS signing/notarisation secrets seen by a repo-scoped job:"
          missing=0
          for s in MAC_CSC_LINK MAC_CSC_KEY_PASSWORD APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            v="$(eval echo \"\$$s\")"
            if [ -n "$v" ]; then
              echo "  $s = set (${#v} chars)"
            else
              echo "  $s = EMPTY"
              missing=$((missing+1))
            fi
          done
          echo
          # Rough sanity hints (still no values printed):
          case "${#APPLE_API_KEY_ID}" in 10) ;; 0) ;; *) echo "note: APPLE_API_KEY_ID is usually 10 chars (got ${#APPLE_API_KEY_ID})";; esac
          case "${#APPLE_API_ISSUER}" in 36) ;; 0) ;; *) echo "note: APPLE_API_ISSUER is usually a 36-char UUID (got ${#APPLE_API_ISSUER})";; esac
          if [ -n "$APPLE_API_KEY_P8" ] && ! printf '%s' "$APPLE_API_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then
            echo "note: APPLE_API_KEY_P8 does not contain 'BEGIN PRIVATE KEY' — paste the FULL .p8 contents including header/footer lines."
          fi
          echo
          if [ "$missing" -eq 0 ]; then
            echo "All five present. The release build will sign + notarise."
          else
            echo "::warning::$missing secret(s) EMPTY — the release build would ship UNSIGNED. Add them as Repository secrets with the exact names above."
          fi

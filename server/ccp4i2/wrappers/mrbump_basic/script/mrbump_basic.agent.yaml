  - server/ccp4i2/wrappers/mrbump_basic/script/mrbump_basic_report.py (final_solutions)
  - server/ccp4i2/wrappers/mrbump_basic/script/mrbump_basic.def.xml
  - server/ccp4i2/wrappers/mrbump_basic/script/mrbump_basic.py (recordFinalSolutions)
  - server/ccp4i2/tests/i2run/test_mrbump.py (Gamma, R-free < 0.35)
  - "ccp4-20260702 site-packages/mrbump: initialisation/MRBUMP_master.py 1210-1232 (PHAQ path), mr/phaserQuick.py 100-191 (final search, rows), mr/MRBUMP_MR.py 76-78 (XMLOUT only in full MR)"
  - "run: MDM2 job 113 (mrbump_basic, one local model 3dab chain A, LOCALONLY; correct placement, R-free 0.52)"

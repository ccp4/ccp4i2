<!DOCTYPE html SYSTEM "about:legacy-compat">

<html xmlns="http://www.w3.org/1999/xhtml" lang="nl">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>PDB-REDO Result Page</title>

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
</head>

<body>

		<article>
			<h4>PDB-REDO databank entry</h4>
			<pdb-redo-result data-url='.'>
				<!-- Placeholders to improve time to first paint -->
				<h1>PDB-REDO results for  PDB-REDO job</h1>

			</pdb-redo-result>
		</article>

		<hr />

	</div>

	<script src="/report_files/0.1.0/pdb-redo/pdb-redo-result-loader.js" type="text/javascript"></script>
        <!--<script src="http://pdb-redo.eu/scripts/pdb-redo-result-loader.js" type="text/javascript"></script>-->

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
		crossorigin="anonymous"></script>

	<script type="text/javascript">
	(function () {
		'use strict';
		// The PDB-REDO web component renders remotely: it POSTs this job's
		// data.json to pdb-redo.eu and injects the HTML that comes back. Every
		// file link in that HTML is therefore absolute to the databank host —
		// but these are this job's own results, produced from a private API
		// submission the databank keeps no copy of, so each link 404s there.
		// The files are sitting in this directory. Point the links at them.
		var DATABANK = 'https://pdb-redo.eu/';

		function disable(anchor, why) {
			anchor.removeAttribute('href');
			anchor.removeAttribute('download');
			anchor.style.opacity = '0.5';
			anchor.style.cursor = 'default';
			anchor.title = why;
		}

		// CCP4i2 unpacks a subset of the PDB-REDO results zip, so some links
		// have no local target. Showing them as unavailable beats a dead link.
		// Only a 404 is taken as proof of absence: anything else (a method the
		// server declines, a transient failure) leaves the link usable rather
		// than greying out a file that is actually there.
		function confirmPresent(anchor, url) {
			fetch(url, { method: 'HEAD' }).then(function (response) {
				if (response.status === 404) {
					disable(anchor, 'Not among the files kept for this job');
				}
			}).catch(function () { /* leave the link alone */ });
		}

		function localise(root) {
			var links = root.querySelectorAll('a[href^="' + DATABANK + '"]');
			Array.prototype.forEach.call(links, function (anchor) {
				var name = anchor.getAttribute('href').slice(DATABANK.length);
				if (!name) {
					return;  // the header logo, which does link to the site itself
				}
				if (name === 'null') {
					// The remote renderer emits this where an entry has no file.
					disable(anchor, 'Not available');
					return;
				}
				anchor.setAttribute('href', './' + name);
				anchor.setAttribute('download', name.split('/').pop());
				confirmPresent(anchor, './' + name);
			});
		}

		var attempts = 0;
		function start() {
			var element = document.querySelector('pdb-redo-result');
			if (!element || !element.shadowRoot) {
				if (++attempts < 100) {
					window.setTimeout(start, 100);
				}
				return;
			}
			localise(element.shadowRoot);
			// The component replaces its content wholesale once the remote
			// render returns, so rewrite again whenever that happens.
			new MutationObserver(function () {
				localise(element.shadowRoot);
			}).observe(element.shadowRoot, { childList: true, subtree: true });
		}
		start();
	})();
	</script>

</body>

</html>
